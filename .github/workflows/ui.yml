name: UI

on:
  push:
    branches:
      - main
    paths:
      - "ui/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set environment config
        id: config
        run: |
          if [ "${{ steps.env.outputs.environment }}" == "prod" ]; then
            echo "api_url=https://prod.34.40.161.175.nip.io" >> $GITHUB_OUTPUT
            echo "auth0_domain=dev-dq1p4t4guh2d2oj3.au.auth0.com" >> $GITHUB_OUTPUT
            echo "auth0_client_id=z6qBVsN678zmVCf5db2ZybqbcOG6srv5" >> $GITHUB_OUTPUT
            echo "auth0_audience=https://api.prod.gainline.io" >> $GITHUB_OUTPUT
          else
            echo "api_url=https://dev.35.189.24.64.nip.io" >> $GITHUB_OUTPUT
            echo "auth0_domain=dev-dq1p4t4guh2d2oj3.au.auth0.com" >> $GITHUB_OUTPUT
            echo "auth0_client_id=CkHz9nnnyx4ZMrag1ZCBejluZNiMeniz" >> $GITHUB_OUTPUT
            echo "auth0_audience=https://api.dev.gainline.io" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push image
        run: |
          docker build \
            --build-arg API_URL="${{ steps.config.outputs.api_url }}" \
            --build-arg AUTH0_DOMAIN="${{ steps.config.outputs.auth0_domain }}" \
            --build-arg AUTH0_CLIENT_ID="${{ steps.config.outputs.auth0_client_id }}" \
            --build-arg AUTH0_AUDIENCE="${{ steps.config.outputs.auth0_audience }}" \
            -t australia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gainline-${{ steps.env.outputs.environment }}/ui:${{ steps.tag.outputs.tag }} \
            ./ui

          docker push australia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gainline-${{ steps.env.outputs.environment }}/ui:${{ steps.tag.outputs.tag }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: gainline-${{ steps.env.outputs.environment }}
          location: australia-southeast1-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install ui infra/helm/ui \
            -f infra/helm/ui/values-${{ steps.env.outputs.environment }}.yaml \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --set image.repository=australia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gainline-${{ steps.env.outputs.environment }}/ui \
            --namespace gainline-${{ steps.env.outputs.environment }} \
            --create-namespace
